span><br><span class="line">62</span><br><span class="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br><span class="line">91</span><br><span class="line">92</span><br><span class="line">93</span><br><span class="line">94</span><br><span class="line">95</span><br><span class="line">96</span><br><span class="line">97</span><br><span class="line">98</span><br><span class="line">99</span><br><span class="line">100</span><br><span class="line">101</span><br><span class="line">102</span><br><span class="line">103</span><br><span class="line">104</span><br><span class="line">105</span><br><span class="line">106</span><br><span class="line">107</span><br><span class="line">108</span><br><span class="line">109</span><br><span class="line">110</span><br><span class="line">111</span><br><span class="line">112</span><br><span class="line">113</span><br><span class="line">114</span><br><span class="line">115</span><br><span class="line">116</span><br><span class="line">117</span><br></pre></td><td class="code"><pre><span class="line"><span class="comment">/** 访客详情Ai跟进 */</span></span><br><span class="line">    <span class="meta">@PostMapping(</span></span><br><span class="line"><span class="meta">            value = &quot;visitorDetailAiAnalyse&quot;,</span></span><br><span class="line"><span class="meta">            produces = MediaType.TEXT_EVENT_STREAM_VALUE</span></span><br><span class="line"><span class="meta">    )</span></span><br><span class="line">    <span class="function"><span class="keyword">public</span> SseEmitter <span class="title">visitorDetailAiAnalyse</span><span class="params">(</span></span></span><br><span class="line"><span class="params"><span class="function">            <span class="meta">@RequestBody</span> VisitorDetailAiAnalyseReq req</span></span></span><br><span class="line"><span class="params"><span class="function">    )</span> </span>&#123;</span><br><span class="line">        req.checkParams();</span><br><span class="line">        <span class="comment">// 不是取历史结果就生成新的</span></span><br><span class="line">        aiApplication.visitorSpuDetailAiAnalyseAsync(</span><br><span class="line">                req,</span><br><span class="line">                XcxRequestContext.getCheckUserInfo()</span><br><span class="line">        );</span><br><span class="line">        <span class="keyword">return</span> aiApplication.visitorDetailAiAnalyse(</span><br><span class="line">                req,</span><br><span class="line">                XcxRequestContext.getUserInfo().getUserId()</span><br><span class="line">        );</span><br><span class="line">    &#125;</span><br><span class="line"></span><br><span class="line"></span><br><span class="line">String systemContent = aiDefaultSystemSmg.getContent().replace(<span class="string">&quot;[机构名称]&quot;</span>, companyInfo.getCompanyName());</span><br><span class="line">        <span class="comment">// 构建分析请求</span></span><br><span class="line">        String questionContent = queryVisitorActionDetailDto == <span class="keyword">null</span> ? <span class="string">&quot;无用户行为数据&quot;</span> : queryVisitorActionDetailDto.buildColumnAiDesc(companyInfo.getCompanyUserId(), <span class="keyword">false</span>);</span><br><span class="line">        StringBuilder contentBuilder = <span class="keyword">new</span> StringBuilder();</span><br><span class="line">        contentBuilder</span><br><span class="line">                .append(<span class="string">&quot;\n&quot;</span>)</span><br><span class="line">                .append(<span class="string">&quot;&lt;用户行为数据&gt;&quot;</span>)</span><br><span class="line">                .append(<span class="string">&quot;\n&quot;</span>)</span><br><span class="line">                .append(questionContent)</span><br><span class="line">                .append(<span class="string">&quot;\n&quot;</span>)</span><br><span class="line">                .append(<span class="string">&quot;\n&quot;</span>)</span><br><span class="line">                .append(<span class="string">&quot;&lt;商品排行榜数据&gt;&quot;</span>)</span><br><span class="line">                .append(<span class="string">&quot;\n&quot;</span>)</span><br><span class="line">                .append(wuHanApi.liveSpuCsvStringByPlatformId(taskInfo.getPlatformId()));</span><br><span class="line">        Generation gen = <span class="keyword">new</span> Generation();</span><br><span class="line">        List&lt;Message&gt; messages = Lists.newArrayList();</span><br><span class="line">        messages.add(Message</span><br><span class="line">                .builder()</span><br><span class="line">                .role(Role.SYSTEM.getValue())</span><br><span class="line">                <span class="comment">// 前置系统文案，告诉模型对话上下文及注意事项</span></span><br><span class="line">                .content(systemContent)</span><br><span class="line">                .build()</span><br><span class="line">        );</span><br><span class="line">        <span class="comment">// 本次聊天文案</span></span><br><span class="line">        messages.add(Message.builder().role(Role.USER.getValue()).content(contentBuilder.toString()).build());</span><br><span class="line">        GenerationParam generationParam = buildGenerationParamStream(messages);</span><br><span class="line">        Flowable&lt;GenerationResult&gt; result;</span><br><span class="line">        <span class="keyword">try</span> &#123;</span><br><span class="line">            result = gen.streamCall(generationParam);</span><br><span class="line">        &#125; <span class="keyword">catch</span> (Exception e) &#123;</span><br><span class="line">            log.error(<span class="string">&quot;通过流生成结果失败, errMsg:&#123;&#125;&quot;</span>, e.getMessage(), e);</span><br><span class="line">            <span class="keyword">throw</span> <span class="keyword">new</span> BusinessServiceException(<span class="string">&quot;通过流生成结果失败&quot;</span>);</span><br><span class="line">        &#125;</span><br><span class="line">        <span class="comment">// 流程处理完毕的后置处理</span></span><br><span class="line">        result.subscribe(</span><br><span class="line">                nextMessage -&gt; &#123;</span><br><span class="line">                    GenerationOutput.Choice choice = nextMessage.getOutput().getChoices().get(<span class="number">0</span>);</span><br><span class="line">                    <span class="comment">// 思考过程，就是思考过程中的自言自语</span></span><br><span class="line">                    String reasoning = choice.getMessage().getReasoningContent();</span><br><span class="line">                    <span class="keyword">if</span> (StringUtils.isNotBlank(reasoning)) &#123;</span><br><span class="line">                        <span class="comment">// 业务上处理思考过程</span></span><br><span class="line">                        eventData.appendReasoningData(reasoning);</span><br><span class="line">                        emitter.send(</span><br><span class="line">                                VisitorDetailAiAnalyseDto.builder()</span><br><span class="line">                                        .reasoning(reasoning)</span><br><span class="line">                                        .finishReason(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .output(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .build()</span><br><span class="line">                        );</span><br><span class="line">                    &#125;</span><br><span class="line">                    <span class="comment">// 思考结果</span></span><br><span class="line">                    String content = choice.getMessage().getContent();</span><br><span class="line">                    <span class="keyword">if</span> (StringUtils.isNotBlank(content)) &#123;</span><br><span class="line">                        eventData.appendData(content);</span><br><span class="line">                        emitter.send(</span><br><span class="line">                                VisitorDetailAiAnalyseDto.builder()</span><br><span class="line">                                        .output(content)</span><br><span class="line">                                        .finishReason(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .reasoning(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .build()</span><br><span class="line">                        );</span><br><span class="line">                    &#125;</span><br><span class="line">                    <span class="comment">// 结束后处理</span></span><br><span class="line">                    String finishReason = choice.getFinishReason();</span><br><span class="line">                    <span class="keyword">if</span> (<span class="string">&quot;stop&quot;</span>.equals(finishReason)) &#123;</span><br><span class="line">                        emitter.send(</span><br><span class="line">                                VisitorDetailAiAnalyseDto.builder()</span><br><span class="line">                                        .reasoning(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .output(<span class="string">&quot;&quot;</span>)</span><br><span class="line">                                        .finishReason(<span class="string">&quot;stop&quot;</span>)</span><br><span class="line">                                        .build()</span><br><span class="line">                        );</span><br><span class="line">                        <span class="comment">// 流已经发送完毕 业务上是否要额外处理</span></span><br><span class="line">                        aiContantRecordRepo.save(</span><br><span class="line">                                AiContantRecord.builder()</span><br><span class="line">                                        .taskId(req.getTaskId())</span><br><span class="line">                                        .userId(userId)</span><br><span class="line">                                        .wxUnionId(req.getUnionId())</span><br><span class="line">                                        .wxMemberId(req.getWxMemberId())</span><br><span class="line">                                        .question(systemContent + <span class="string">&quot;\n&quot;</span> + contentBuilder)</span><br><span class="line">                                        .content(eventData.getEventData())</span><br><span class="line">                                        .reasoning(eventData.getReasoningData())</span><br><span class="line">                                        .build()</span><br><span class="line">                        );</span><br><span class="line">                        <span class="comment">// 清空 StringBuilder 中的数据</span></span><br><span class="line">                        eventData.clearData();</span><br><span class="line">                    &#125;</span><br><span class="line">                &#125;,</span><br><span class="line">                throwable -&gt; &#123;</span><br><span class="line">                    log.info(<span class="string">&quot;ai分析结果，过程出现异常&quot;</span>, throwable);</span><br><span class="line">                    eventData.clearData();</span><br><span class="line">                    emitter.completeWithError(throwable);</span><br><span class="line">                &#125;,</span><br><span class="line">                emitter::complete</span><br><span class="line">        );</span><br><span class="line">        <span class="keyword">return</span> emitter;</span><br></pre></td></tr></table></figure>
<p>核心就是SseEmitter那套</p>
